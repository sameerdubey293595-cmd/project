name: dreamlens
region: nyc
services:
  - name: web
    source_dir: /
    github:
      repo: YOUR_GITHUB_USERNAME/dreamlens
      branch: main
      deploy_on_push: true
    run_command: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envs:
      - key: DIGITALOCEAN_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: YOUR_DO_API_KEY
      - key: DB_HOST
        scope: RUN_TIME
        value: YOUR_DB_HOST
      - key: DB_PORT
        scope: RUN_TIME
        value: "25060"
      - key: DB_NAME
        scope: RUN_TIME
        value: defaultdb
      - key: DB_USER
        scope: RUN_TIME
        value: doadmin
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: YOUR_DB_PASSWORD
      - key: FLASK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: YOUR_FLASK_SECRET
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    routes:
      - path: /
